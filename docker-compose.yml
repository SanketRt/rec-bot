services:
  rec-bot:
    build: .
    image: rec-bot:latest
    container_name: rec-bot
    restart: unless-stopped
    env_file:
      - .env
    # Run as your host user so the bind-mounted login profile is readable and
    # recordings are owned by you (not the image's uid 1001). Defaults to 1000;
    # override with PUID/PGID in .env if `id -u` differs.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # The host uid may not own /home/pwuser, so give Chrome/PulseAudio a
      # writable HOME.
      - HOME=/tmp
    ports:
      - "8080:8080"
    # Use reliable public resolvers instead of inheriting the host's single
    # (often campus) DNS server. Without this, a flaky upstream resolver leaves
    # the container unable to resolve meet.google.com — the server stays up but
    # every recording fails at join with a page.goto timeout.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Surface network/DNS loss in `docker ps` (status: unhealthy) instead of
    # silently failing recordings. Checks both the local server and that Meet
    # still resolves. Pair with an autoheal sidecar if you want auto-restart.
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS --max-time 5 http://localhost:8080/health >/dev/null && getent hosts meet.google.com >/dev/null"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Chromium is happier with more shared memory even with --disable-dev-shm-usage.
    shm_size: "1gb"
    volumes:
      # Recordings, the persistent Chrome login profile, logs, and schedule.json
      # all live here so they survive container restarts.
      - ./data:/data
      # Mount your rclone config if you upload to Google Drive (UPLOAD_TARGET=drive),
      # and set RCLONE_CONFIG=/data/rclone.conf in .env.
      # - ./rclone.conf:/data/rclone.conf:ro
    # Override to ["serve"] for API-only, or ["schedule"] for scheduler-only.
    command: ["all"]
